<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unity WebGL Host</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0f1115;
        color: #e6e8ee;
        font-family: Arial, sans-serif;
      }
      #unity-root {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: none;
        background: #0f1115;
      }
      .panel {
        max-width: 820px;
        margin: 20px;
        padding: 16px 18px;
        border: 1px solid #3a3f4b;
        border-radius: 12px;
        background: #171a22;
      }
      .panel h1 {
        margin: 0 0 10px;
        font-size: 18px;
      }
      .panel p {
        margin: 6px 0;
        line-height: 1.4;
      }
      code {
        background: #232839;
        padding: 2px 6px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div id="unity-root">
      <canvas id="unity-canvas"></canvas>
      <div class="panel" id="status">
        <h1>Unity WebGL not configured yet</h1>
        <p>
          Place your Unity WebGL build in <code>web/unity/Build</code> and add
          <code>web/unity/config.json</code>.
        </p>
        <p>
          Required config keys: <code>loaderUrl</code>, <code>dataUrl</code>,
          <code>frameworkUrl</code>, <code>codeUrl</code>.
        </p>
      </div>
    </div>
    <script>
      (async function boot() {
        const status = document.getElementById("status");
        const canvas = document.getElementById("unity-canvas");

        let cfg;
        try {
          const response = await fetch("./config.json", { cache: "no-store" });
          if (!response.ok) throw new Error("config.json missing");
          cfg = await response.json();
        } catch (err) {
          status.innerHTML =
            "<h1>Unity WebGL not configured yet</h1>" +
            "<p>Missing <code>web/unity/config.json</code>.</p>" +
            "<p>After adding it, reload this page.</p>";
          return;
        }

        const required = ["loaderUrl", "dataUrl", "frameworkUrl", "codeUrl"];
        const missing = required.filter((k) => !cfg[k]);
        if (missing.length > 0) {
          status.innerHTML =
            "<h1>Unity config incomplete</h1>" +
            "<p>Missing keys: <code>" +
            missing.join(", ") +
            "</code></p>";
          return;
        }

        const loaderScript = document.createElement("script");
        loaderScript.src = cfg.loaderUrl;
        loaderScript.onload = () => {
          if (typeof createUnityInstance !== "function") {
            status.innerHTML =
              "<h1>Unity loader error</h1><p><code>createUnityInstance</code> not found.</p>";
            return;
          }
          status.innerHTML = "<h1>Loading Unity...</h1>";
          createUnityInstance(canvas, cfg, (progress) => {
            status.innerHTML =
              "<h1>Loading Unity...</h1><p>" +
              Math.round(progress * 100) +
              "%</p>";
          })
            .then(() => {
              status.style.display = "none";
              canvas.style.display = "block";
            })
            .catch((error) => {
              status.innerHTML =
                "<h1>Unity failed to start</h1><p>" + String(error) + "</p>";
            });
        };
        loaderScript.onerror = () => {
          status.innerHTML =
            "<h1>Unity loader not found</h1><p>Check <code>loaderUrl</code> in config.json.</p>";
        };
        document.body.appendChild(loaderScript);
      })();
    </script>
  </body>
</html>
